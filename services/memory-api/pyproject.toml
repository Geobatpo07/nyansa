[project]
name = "nyansa-memory-api"
version = "0.1.0"
description = "RAG ingestion and search service for the Nyansa Obsidian vault"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.149.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    "types-pyyaml==6.0.12.20260906",
]

# A service, not a library: uv installs the dependencies only, and the
# modules are run from src/.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["tests/golden/vault"]  # note fixtures, some deliberately not UTF-8

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "S"]
ignore = ["RUF001", "RUF002", "RUF003"]  # accented and typographic characters are expected in note fixtures

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]  # assert and dummy tokens in tests
"tests/golden/make_vault.py" = ["E501"]  # one literal per note

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

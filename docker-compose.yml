# The project name is fixed so that every release directory on the server
# drives the same containers and volumes.
name: nyansa

volumes:
  nyansa_n8n_storage:
    name: nyansa_n8n_storage
  nyansa_postgres_storage:
    name: nyansa_postgres_storage
  nyansa_ollama_storage:
    name: nyansa_ollama_storage
  nyansa_qdrant_storage:
    name: nyansa_qdrant_storage
  nyansa_openwebui_storage:
    name: nyansa_openwebui_storage
  nyansa_caddy_data:
    name: nyansa_caddy_data
  nyansa_caddy_config:
    name: nyansa_caddy_config

networks:
  nyansa:
    name: nyansa

x-n8n: &service-n8n
  image: n8nio/n8n:${N8N_VERSION:-2.40.7}
  networks: ['nyansa']
  # Only the variables n8n needs. The whole .env is never injected, so proxy
  # and Tailscale secrets stay out of the n8n container.
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=nyansa-postgres
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET}
    - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    # Injects the Qdrant API key into every credential of type qdrantApi at
    # runtime. The key lives only in .env; rotating it needs a restart only.
    - 'CREDENTIALS_OVERWRITE_DATA={"qdrantApi":{"apiKey":"${QDRANT_API_KEY}"}}'

x-caddy: &service-caddy
  image: caddy:${CADDY_VERSION:-2.11.4-alpine}
  container_name: nyansa-caddy
  restart: unless-stopped
  environment:
    - ACME_EMAIL=${ACME_EMAIL:-}
    - WEBUI_DOMAIN=${WEBUI_DOMAIN:-}
    - N8N_DOMAIN=${N8N_DOMAIN:-}
    - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-}
    - N8N_BASIC_AUTH_HASH=${N8N_BASIC_AUTH_HASH:-}
    - TS_HOSTNAME=${TS_HOSTNAME:-}
    - TS_TAILNET=${TS_TAILNET:-}
  healthcheck:
    # Admin API, only reachable from inside the container's network namespace.
    test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:2019/config/']
    interval: 10s
    timeout: 5s
    retries: 10
  depends_on:
    nyansa-n8n:
      condition: service_started
    nyansa-open-webui:
      condition: service_started

x-ollama: &service-ollama
  image: ollama/ollama:${OLLAMA_VERSION:-0.34.4}
  container_name: nyansa-ollama
  networks: ['nyansa']
  restart: unless-stopped
  healthcheck:
    test: ['CMD', 'ollama', 'list']
    interval: 10s
    timeout: 5s
    retries: 10
  # No published port: n8n, Open WebUI and memory-api reach Ollama at
  # nyansa-ollama:11434 on the internal network. Ollama has no authentication.
  volumes:
    - nyansa_ollama_storage:/root/.ollama

x-init-ollama: &init-ollama
  image: ollama/ollama:${OLLAMA_VERSION:-0.34.4}
  networks: ['nyansa']
  container_name: nyansa-ollama-pull-model
  volumes:
    - nyansa_ollama_storage:/root/.ollama
  entrypoint: /bin/sh
  environment:
    - OLLAMA_HOST=nyansa-ollama:11434
  command:
    - "-c"
    # Modèle léger adapté au CPU-only / RAM limitée. Remplacer par qwen2.5:7b si la RAM le permet.
    - "sleep 3; ollama pull qwen2.5:3b; ollama pull nomic-embed-text"

services:
  nyansa-postgres:
    image: postgres:${POSTGRES_VERSION:-16.15-alpine}
    hostname: nyansa-postgres
    container_name: nyansa-postgres
    networks: ['nyansa']
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - nyansa_postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  nyansa-n8n-import:
    <<: *service-n8n
    hostname: nyansa-n8n-import
    container_name: nyansa-n8n-import
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        if [ -z "$$(n8n list:workflow --onlyId)" ]; then
          n8n import:credentials --separate --input=/demo-data/credentials && \
          n8n import:workflow --separate --input=/demo-data/workflows
        else
          echo "Workflows exist, skipping import"
        fi
    volumes:
      - ./n8n/demo-data:/demo-data:ro
    depends_on:
      nyansa-postgres:
        condition: service_healthy

  nyansa-n8n:
    <<: *service-n8n
    hostname: nyansa-n8n
    container_name: nyansa-n8n
    restart: unless-stopped
    # Loopback only: reachable through the reverse proxy or an SSH tunnel.
    ports:
      - 127.0.0.1:5678:5678
    volumes:
      - nyansa_n8n_storage:/home/node/.n8n
      - ${NYANSA_FILES_PATH:-./shared}:/data/shared
      # Vault Obsidian synchronisé par Syncthing, monté en lecture/écriture
      - ${OBSIDIAN_VAULT_PATH}:/data/obsidian-vault
    depends_on:
      nyansa-postgres:
        condition: service_healthy
      nyansa-n8n-import:
        condition: service_completed_successfully
    healthcheck:
      # The n8n image has neither curl nor wget.
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5678/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nyansa-qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.19.1}
    hostname: nyansa-qdrant
    container_name: nyansa-qdrant
    networks: ['nyansa']
    restart: unless-stopped
    # No published port: clients use nyansa-qdrant:6333 on the internal network.
    # Every request except the health endpoints needs the API key.
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - nyansa_qdrant_storage:/qdrant/storage
    healthcheck:
      # The Qdrant image has no HTTP client; bash's /dev/tcp is enough.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.0

" >&3 && grep -q "200 OK" <&3']
      interval: 10s
      timeout: 5s
      retries: 10

  nyansa-open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION:-v0.7.2}
    hostname: nyansa-open-webui
    container_name: nyansa-open-webui
    networks: ['nyansa']
    restart: unless-stopped
    # Loopback only: reachable through the reverse proxy or an SSH tunnel.
    ports:
      - 127.0.0.1:3000:8080
    environment:
      - OLLAMA_BASE_URL=http://nyansa-ollama:11434
    volumes:
      - nyansa_openwebui_storage:/app/backend/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:8080/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    # Only one Ollama variant runs, depending on the hardware profile.
    depends_on:
      nyansa-ollama-cpu:
        condition: service_started
        required: false
      nyansa-ollama-gpu:
        condition: service_started
        required: false
      nyansa-ollama-gpu-amd:
        condition: service_started
        required: false

  nyansa-ollama-cpu:
    profiles: ["cpu"]
    <<: *service-ollama

  nyansa-ollama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *service-ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  nyansa-ollama-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *service-ollama
    image: ollama/ollama:${OLLAMA_VERSION:-0.34.4}-rocm
    devices:
      - "/dev/kfd"
      - "/dev/dri"

  nyansa-ollama-pull-model-cpu:
    profiles: ["cpu"]
    <<: *init-ollama
    depends_on:
      - nyansa-ollama-cpu

  nyansa-ollama-pull-model-gpu:
    profiles: ["gpu-nvidia"]
    <<: *init-ollama
    depends_on:
      - nyansa-ollama-gpu

  nyansa-ollama-pull-model-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *init-ollama
    image: ollama/ollama:${OLLAMA_VERSION:-0.34.4}-rocm
    depends_on:
      - nyansa-ollama-gpu-amd

  # ---------------------------------------------------------------------------
  # Access profiles: enable exactly one of "public" or "tailscale".
  # ---------------------------------------------------------------------------

  # Public HTTPS on ports 80/443 with Let's Encrypt. The only service allowed
  # to publish ports on all interfaces.
  nyansa-caddy-public:
    profiles: ["public"]
    <<: *service-caddy
    networks: ['nyansa']
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - nyansa_caddy_data:/data
      - nyansa_caddy_config:/config
      - ./caddy/Caddyfile.public:/etc/caddy/Caddyfile:ro

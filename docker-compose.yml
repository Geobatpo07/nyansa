volumes:
  nyansa_n8n_storage:
  nyansa_postgres_storage:
  nyansa_ollama_storage:
  nyansa_qdrant_storage:
  nyansa_openwebui_storage:

networks:
  nyansa:

x-n8n: &service-n8n
  image: n8nio/n8n:latest
  networks: ['nyansa']
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=nyansa-postgres
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY
    - N8N_USER_MANAGEMENT_JWT_SECRET
    - OLLAMA_HOST=${OLLAMA_HOST:-nyansa-ollama:11434}
  env_file:
    - path: .env
      required: true

x-ollama: &service-ollama
  image: ollama/ollama:latest
  container_name: nyansa-ollama
  networks: ['nyansa']
  restart: unless-stopped
  ports:
    - 11434:11434
  volumes:
    - nyansa_ollama_storage:/root/.ollama

x-init-ollama: &init-ollama
  image: ollama/ollama:latest
  networks: ['nyansa']
  container_name: nyansa-ollama-pull-model
  volumes:
    - nyansa_ollama_storage:/root/.ollama
  entrypoint: /bin/sh
  environment:
    - OLLAMA_HOST=nyansa-ollama:11434
  command:
    - "-c"
    # Modèle léger adapté au CPU-only / RAM limitée. Remplacer par qwen2.5:7b si la RAM le permet.
    - "sleep 3; ollama pull qwen2.5:3b; ollama pull nomic-embed-text"

services:
  nyansa-postgres:
    image: postgres:16-alpine
    hostname: nyansa-postgres
    container_name: nyansa-postgres
    networks: ['nyansa']
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - nyansa_postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  nyansa-n8n-import:
    <<: *service-n8n
    hostname: nyansa-n8n-import
    container_name: nyansa-n8n-import
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        if [ -z "$(n8n list:workflow --onlyId)" ]; then
          n8n import:credentials --separate --input=/demo-data/credentials && \
          n8n import:workflow --separate --input=/demo-data/workflows
        else
          echo "Workflows exist, skipping import"
        fi
    volumes:
      - ./n8n/demo-data:/demo-data
    depends_on:
      nyansa-postgres:
        condition: service_healthy

  nyansa-n8n:
    <<: *service-n8n
    hostname: nyansa-n8n
    container_name: nyansa-n8n
    restart: unless-stopped
    ports:
      - 5678:5678
    volumes:
      - nyansa_n8n_storage:/home/node/.n8n
      - ./n8n/demo-data:/demo-data
      - ./shared:/data/shared
      # Vault Obsidian synchronisé par Syncthing, monté en lecture/écriture
      - ${OBSIDIAN_VAULT_PATH}:/data/obsidian-vault
    depends_on:
      nyansa-postgres:
        condition: service_healthy
      nyansa-n8n-import:
        condition: service_completed_successfully

  nyansa-qdrant:
    image: qdrant/qdrant
    hostname: nyansa-qdrant
    container_name: nyansa-qdrant
    networks: ['nyansa']
    restart: unless-stopped
    ports:
      - 6333:6333
    volumes:
      - nyansa_qdrant_storage:/qdrant/storage

  nyansa-open-webui:
    image: ghcr.io/open-webui/open-webui:main
    hostname: nyansa-open-webui
    container_name: nyansa-open-webui
    networks: ['nyansa']
    restart: unless-stopped
    ports:
      - 3000:8080
    environment:
      - OLLAMA_BASE_URL=http://nyansa-ollama:11434
    volumes:
      - nyansa_openwebui_storage:/app/backend/data
    depends_on:
      - nyansa-ollama-cpu

  nyansa-ollama-cpu:
    profiles: ["cpu"]
    <<: *service-ollama

  nyansa-ollama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *service-ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  nyansa-ollama-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *service-ollama
    image: ollama/ollama:rocm
    devices:
      - "/dev/kfd"
      - "/dev/dri"

  nyansa-ollama-pull-model-cpu:
    profiles: ["cpu"]
    <<: *init-ollama
    depends_on:
      - nyansa-ollama-cpu

  nyansa-ollama-pull-model-gpu:
    profiles: ["gpu-nvidia"]
    <<: *init-ollama
    depends_on:
      - nyansa-ollama-gpu

  nyansa-ollama-pull-model-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *init-ollama
    image: ollama/ollama:rocm
    depends_on:
      - nyansa-ollama-gpu-amd